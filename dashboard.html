<!doctype html>
<html lang="km">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>ការបញ្ជាទិញ · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F6F1E7; --card:#fff; --ink:#241B12; --muted:#7A6E60; --line:#E6DCC8; --acc:#B5543A; --ok:#3F7D5C; --warn:#C98A1B; --bad:#B8213F; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17120D; --card:#241D16; --ink:#F3EBDD; --muted:#A59A8A; --line:#3A3025; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans Khmer",system-ui,sans-serif; padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }
  .wrap { max-width:720px; margin:0 auto; padding:14px; }
  h1 { font-size:20px; margin:4px 0 12px; display:flex; align-items:center; gap:8px; }
  h1 .sp { flex:1; }
  input { width:100%; padding:13px 14px; margin-bottom:10px; border:1.5px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); font:inherit; font-size:16px; }
  button { font:inherit; cursor:pointer; }
  .btn { padding:12px 16px; border:none; border-radius:12px; background:var(--acc); color:#fff; font-weight:700; width:100%; }
  .sm { padding:7px 12px; border:1.5px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); font-size:13px; font-weight:500; width:auto; }
  .sm.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  .stat b { display:block; font-size:18px; } .stat span { font-size:12px; color:var(--muted); }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px; }
  .chips .sm { white-space:nowrap; }
  .order { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; border-left:5px solid var(--warn); }
  .order.contacted { border-left-color:#2E6DB4; } .order.shipping { border-left-color:#7A4EC2; } .order.done { border-left-color:var(--ok); } .order.cancel { border-left-color:var(--bad); opacity:.65; }
  .top { display:flex; justify-content:space-between; gap:8px; align-items:start; }
  .name { font-weight:700; font-size:16px; } .time { font-size:12px; color:var(--muted); white-space:nowrap; }
  .meta { margin:6px 0 10px; font-size:14px; line-height:1.7; word-break:break-word; }
  .meta a { color:var(--acc); font-weight:700; text-decoration:none; }
  .price { font-weight:700; color:var(--acc); }
  .acts { display:flex; flex-wrap:wrap; gap:6px; }
  .err { color:var(--bad); font-size:13px; min-height:18px; margin-bottom:8px; }
  .pay { margin:8px 0 10px; padding:10px; border:1px dashed var(--line); border-radius:12px; }
  .payrow { display:flex; gap:6px; } .payrow input { margin:0; font-size:14px; padding:9px 10px; min-width:0; }
  .paystat { font-size:13px; font-weight:700; margin:8px 0; }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }
  #login { max-width:380px; margin:12vh auto 0; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login">
    <h1>🔐 Dashboard</h1>
    <input id="em" type="email" placeholder="អ៊ីមែល" autocomplete="username" />
    <input id="pw" type="password" placeholder="ពាក្យសម្ងាត់" autocomplete="current-password" />
    <div class="err" id="lerr"></div>
    <button class="btn" id="go" type="button">ចូល</button>
  </div>
  <div id="app" style="display:none">
    <h1>📦 ការបញ្ជាទិញ <span class="sp"></span><button class="sm" id="rf" type="button">↻</button><button class="sm" id="lo" type="button">ចេញ</button></h1>
    <div class="stats" id="stats"></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </div>
</div>
<div id="rcv" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99;align-items:center;justify-content:center;flex-direction:column;padding:16px;gap:12px">
  <button class="sm" id="rcv-x" type="button" style="position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px">✕ បិទ</button>
  <div id="rcv-msg" style="color:#fff;font-size:14px"></div>
  <img id="rcv-img" alt="" style="display:none;max-width:100%;max-height:78vh;border-radius:12px;background:#fff" />
  <a id="rcv-open" target="_blank" rel="noopener" style="display:none;color:#fff;font-size:14px">បើកក្នុងផ្ទាំងថ្មី ↗</a>
</div>
<script>
const SB_URL = "https://jbdxyxypgmdldxktixyd.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpiZHh5eHlwZ21kbGR4a3RpeHlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMjAzNzYsImV4cCI6MjEwODg5NjM3Nn0.3vvF45w20T_giyk66jXKqEoAd9bylA7Py4O89JAtfE0";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const ST = { new: "ថ្មី", contacted: "កំពុងរៀបចំ", shipping: "កំពុងដឹកជញ្ជូន", done: "ដឹកដល់ហើយ", cancel: "បោះបង់" };
let sess = null, orders = [], flt = "all", timer;
try { sess = JSON.parse(localStorage.getItem("sbSess") || "null"); } catch (e) {}
try { $("em").value = localStorage.getItem("adminEmail") || ""; } catch (e) {}

async function auth(body, grant) {
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || "auth");
  sess = { at: j.access_token, rt: j.refresh_token, exp: Date.now() + (j.expires_in - 60) * 1000 };
  try { localStorage.setItem("sbSess", JSON.stringify(sess)); } catch (e) {}
}
async function token() {
  if (!sess) throw new Error("login");
  if (Date.now() > sess.exp) await auth({ refresh_token: sess.rt }, "refresh_token");
  return sess.at;
}
async function api(path, opt = {}) {
  const t = await token();
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { ...opt, headers: { apikey: SB_KEY, Authorization: "Bearer " + t, "Content-Type": "application/json", Prefer: "return=minimal", ...(opt.headers || {}) } });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return opt.method && opt.method !== "GET" ? null : r.json();
}
// បំប្លែងចំនួនទឹកប្រាក់៖ មិនគិត .00 / ក្បៀស / ដកឃ្លា / ៛ និងទទួលលេខខ្មែរ
function parseAmount(v) {
  let s = String(v || "").replace(/[០-៩]/g, (c) => "០១២៣៤៥៦៧៨៩".indexOf(c)).replace(/[^\d.,]/g, "").replace(/,/g, "");
  if (/\.\d{1,2}$/.test(s)) s = s.replace(/\.\d{1,2}$/, "");   // 38000.00 → 38000
  s = s.replace(/\./g, "");                                      // 38.000 → 38000
  return s === "" ? null : parseInt(s, 10);
}
function payState(o) {
  if (o.paid_amount == null) return ["⏳ មិនទាន់ផ្ទៀងផ្ទាត់ទឹកប្រាក់", "var(--muted)"];
  const df = o.paid_amount - (o.price || 0);
  if (df >= 0) return [df > 0 ? `✅ បង់គ្រប់ (លើស ${money(df)})` : "✅ បង់គ្រប់", "var(--ok)"];
  return [`⚠️ បង់មិនទាន់គ្រប់ · ខ្វះ ${money(-df)}`, "var(--bad)"];
}
function payPanel(o) {
  if (o.pay_method !== "qr") return "";
  const [t, c] = payState(o), short = o.paid_amount != null && o.paid_amount < (o.price || 0);
  return `<div class="pay"><div class="payrow"><input data-payer value="${esc(o.payer_name || "")}" placeholder="ឈ្មោះអ្នកបង់ (លើបង្កាន់ដៃ)"><input data-paid type="text" inputmode="decimal" value="${o.paid_amount == null ? "" : o.paid_amount}" placeholder="ទឹកប្រាក់ ៛"><button class="sm" data-savepay="1" type="button">រក្សា</button></div>
    <div class="paystat" style="color:${c}">${t}</div>${short ? `<button class="sm" data-sms="1" type="button" style="border-color:var(--bad);color:var(--bad)">📩 ប្រាប់ភ្ញៀវថាបង់មិនទាន់គ្រប់</button>` : ""}</div>`;
}
const money = (n) => Number(n || 0).toLocaleString("en-US") + " ៛";
const when = (s) => new Date(s).toLocaleString("en-GB", { timeZone: "Asia/Phnom_Penh", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
const dayKey = (s) => new Date(s).toLocaleDateString("en-CA", { timeZone: "Asia/Phnom_Penh" });

async function load() {
  if (document.activeElement && document.activeElement.matches && document.activeElement.matches("#list input")) return;
  try { orders = await api("orders?select=*&order=created_at.desc&limit=300", { headers: { Prefer: "" } }); draw(); $("lerr").textContent = ""; }
  catch (e) { if (e.message === "login" || /401|403/.test(e.message)) logout(); else $("list").innerHTML = `<div class="empty">ទាញទិន្នន័យមិនបាន (${esc(e.message)})</div>`; }
}
function draw() {
  const today = dayKey(new Date()), live = orders.filter((o) => o.status !== "cancel");
  const td = live.filter((o) => dayKey(o.created_at) === today);
  $("stats").innerHTML = `<div class="stat"><b>${orders.filter((o) => o.status === "new").length}</b><span>ថ្មី</span></div>
    <div class="stat"><b>${td.length}</b><span>ថ្ងៃនេះ</span></div>
    <div class="stat"><b>${money(td.reduce((s, o) => s + (o.price || 0), 0))}</b><span>សរុបថ្ងៃនេះ</span></div>`;
  $("chips").innerHTML = [["all", "ទាំងអស់", orders.length], ...Object.entries(ST).map(([k, v]) => [k, v, orders.filter((o) => o.status === k).length])]
    .map(([k, v, c]) => `<button class="sm${flt === k ? " on" : ""}" data-f="${k}" type="button">${v} (${c})</button>`).join("");
  const rows = orders.filter((o) => flt === "all" || o.status === flt);
  $("list").innerHTML = rows.length ? rows.map((o) => `<div class="order ${esc(o.status)}" data-id="${o.id}">
    <div class="top"><div class="name">${esc(o.product)}${o.size ? " · " + esc(o.size) : ""}</div><div class="time">${when(o.created_at)}</div></div>
    <div class="meta"><span class="price">${money(o.price)}</span> · #${esc(o.product_no)}${o.order_code ? " · 🔖 <b>" + esc(o.order_code) + "</b>" : ""}${o.pay_method ? " · " + (o.pay_method === "qr" ? "💳 បង់ឥឡូវ" : "🚚 បង់ពេលទទួល") : ""}<br>
      📞 <a href="tel:${esc(String(o.phone).replace(/[^\d+]/g, ""))}">${esc(o.phone)}</a><br>
      ${o.location ? "📍 " + esc(o.location) + "<br>" : ""}
      ${/^https?:\/\//.test(o.map_link || "") ? `🗺 <a href="${esc(o.map_link)}" target="_blank" rel="noopener">បើក Google Map</a>` : ""}</div>
    ${payPanel(o)}
    <div class="pay"><div class="paystat" style="color:var(--ink);margin-top:0">🚚 ការដឹកជញ្ជូន</div>
      <div class="payrow"><input data-courier value="${esc(o.courier || "")}" placeholder="ក្រុមហ៊ុនដឹក"><input data-trackno value="${esc(o.courier_no || "")}" placeholder="លេខតាមដាន"></div>
      <div class="payrow" style="margin-top:6px"><input data-note value="${esc(o.tracking_note || "")}" placeholder="ដឹកដល់ណាហើយ? ឧ. ចេញពីភ្នំពេញ"><button class="sm" data-savetrack="1" type="button">រក្សា</button></div></div>
    <div class="acts">${o.receipt_url ? `<button class="sm" data-rc="${esc(o.receipt_url)}" type="button" style="border-color:var(--ok);color:var(--ok)">🧾 មើលបង្កាន់ដៃ</button>` : ""}${Object.entries(ST).filter(([k]) => k !== o.status).map(([k, v]) => `<button class="sm" data-s="${k}" type="button">${v}</button>`).join("")}<button class="sm" data-del="1" type="button" style="color:var(--bad)">🗑</button></div>
  </div>`).join("") : `<div class="empty">មិនទាន់មានការបញ្ជាទិញ</div>`;
}
$("chips").onclick = (e) => { const b = e.target.closest("[data-f]"); if (b) { flt = b.dataset.f; draw(); } };
$("list").onclick = async (e) => {
  const b = e.target.closest("button"), card = e.target.closest(".order");
  if (!b || !card) return;
  const id = card.dataset.id;
  try {
    if (b.dataset.savenote) {
      const v = card.querySelector("[data-note]").value.trim();
      await api(`orders?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ tracking_note: v || null }) });
      orders.find((o) => String(o.id) === id).tracking_note = v; b.textContent = "✓"; setTimeout(() => { b.textContent = "រក្សា"; }, 1200); return;
    }
    if (b.dataset.savetrack) {
      const o = orders.find((x) => String(x.id) === id), g = (s) => card.querySelector(s).value.trim() || null;
      const body = { courier: g("[data-courier]"), courier_no: g("[data-trackno]"), tracking_note: g("[data-note]") };
      await api(`orders?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(body) });
      Object.assign(o, body); b.textContent = "✓"; setTimeout(() => { b.textContent = "រក្សា"; }, 1200); return;
    }
    if (b.dataset.savepay) {
      const o = orders.find((x) => String(x.id) === id), payer = card.querySelector("[data-payer]").value.trim(), v = card.querySelector("[data-paid]").value.trim();
      const paid = parseAmount(v);
      await api(`orders?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ payer_name: payer || null, paid_amount: paid }) });
      o.payer_name = payer || null; o.paid_amount = paid; draw(); return;
    }
    if (b.dataset.sms) {
      const o = orders.find((x) => String(x.id) === id), short = (o.price || 0) - (o.paid_amount || 0);
      const msg = `សួស្តី${o.payer_name ? " " + o.payer_name : ""}! ការទិញ ${o.product}${o.size ? " ទំហំ " + o.size : ""} តម្លៃ ${money(o.price)}។ យើងទទួលបាន ${money(o.paid_amount)} ប៉ុណ្ណោះ បង់មិនទាន់គ្រប់ ខ្វះ ${money(short)}។ សូមបង់បន្ថែម ហើយផ្ញើបង្កាន់ដៃមកវិញ។ អរគុណ!`;
      try { navigator.clipboard.writeText(msg).catch(() => {}); } catch (x) {}
      const a = document.createElement("a"); a.href = `sms:${String(o.phone).replace(/[^\d+]/g, "")}${/iPhone|iPad/.test(navigator.userAgent) ? "&" : "?"}body=${encodeURIComponent(msg)}`; a.click(); return;
    }
    if (b.dataset.rc) {
      const v = $("rcv"), im = $("rcv-img"), msg = $("rcv-msg"), op = $("rcv-open");
      v.style.display = "flex"; im.style.display = "none"; op.style.display = "none"; msg.textContent = "កំពុងផ្ទុករូប...";
      try {
        const t = await token();
        const r = await fetch(`${SB_URL}/storage/v1/object/sign/receipts/${b.dataset.rc}`, { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: JSON.stringify({ expiresIn: 300 }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.signedURL) throw new Error(`${r.status} ${j.message || j.error || ""}`.trim());
        const u = `${SB_URL}/storage/v1${j.signedURL}`;
        im.onload = () => { msg.textContent = ""; im.style.display = ""; op.href = u; op.style.display = ""; };
        im.onerror = () => { msg.textContent = "បើករូបមិនបាន (ឯកសារអាចខូច ឬមិនមែនរូប)"; };
        im.src = u;
      } catch (err) { msg.textContent = "មើលមិនបាន៖ " + err.message; }
      return;
    }
    if (b.dataset.s) { await api(`orders?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ status: b.dataset.s }) }); orders.find((o) => String(o.id) === id).status = b.dataset.s; }
    else if (b.dataset.del) {
      if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "ចុចម្តងទៀត"; setTimeout(() => { if (b.isConnected) { b.dataset.sure = ""; b.textContent = "🗑"; } }, 3000); return; }
      await api(`orders?id=eq.${id}`, { method: "DELETE" }); orders = orders.filter((o) => String(o.id) !== id);
    }
    draw();
  } catch (err) { alert("មិនបាន៖ " + err.message); }
};
function show() { $("login").style.display = "none"; $("app").style.display = ""; load(); clearInterval(timer); timer = setInterval(load, 30000); }
function logout() { clearInterval(timer); sess = null; try { localStorage.removeItem("sbSess"); } catch (e) {} $("app").style.display = "none"; $("login").style.display = ""; }
$("go").onclick = async () => {
  $("lerr").textContent = "";
  try { await auth({ email: $("em").value.trim(), password: $("pw").value }, "password"); try { localStorage.setItem("adminEmail", $("em").value.trim()); } catch (e) {} $("pw").value = ""; show(); }
  catch (e) { $("lerr").textContent = "អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ"; }
};
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
$("rcv-x").onclick = () => { $("rcv").style.display = "none"; $("rcv-img").removeAttribute("src"); };
$("rf").onclick = load; $("lo").onclick = logout;
if (sess) show();
</script>
</body>
</html>
