<!doctype html>
<html lang="km">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Noto+Serif+Khmer:wght@500;600;700&family=Noto+Sans+Khmer:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<style>
  :root {
    --linen: #F7F1EA;
    --card: #FFFCF6;
    --border: #E6D3C8;
    --ink: #241B12;
    --muted: #8A7468;
    --clay: #C2566E;
    --clay-dark: #9E3A52;
    --clay-light: #D2667E;
    --clay-rgb: 194,86,110;
    --moss: #4B6B4A;
    --brass: #B98A3E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--linen); color: var(--ink); font-family: "Noto Sans Khmer", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; }
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  .ad-login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #241B12, #3A2A20); }
  .ad-card { width: 100%; max-width: 380px; background: var(--card); border-radius: 22px; padding: 26px 22px 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
  .ad-card h1 { font-family: "Playfair Display", "Noto Serif Khmer", Georgia, serif; font-size: 28px; margin: 0 0 4px; }
  .ad-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #1A1A1A; color: #fff; }
  .ad-top h1 { margin: 0; font-family: "Playfair Display", Georgia, serif; font-size: 20px; letter-spacing: 0.04em; }
  .ad-top .ad-saved { margin-left: auto; margin-right: 0; background: rgba(63,125,92,0.25); color: #9FE0B8; }
  .ad-site { color: #FFE08A; font-size: 13px; font-weight: 600; text-decoration: none; padding: 7px 12px; border: 1px solid rgba(255,224,138,0.5); border-radius: 999px; white-space: nowrap; }
  .ad-wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 60px; }
  .ad-wrap h3 { margin: 0; }
  .ad-photo-btn.bn-photo { width: auto; display: inline-block; padding: 10px 18px; font-size: 13px; margin: 6px 0 4px; }

  .sheet-confirm {
    width: 100%; padding: 14px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, var(--clay), var(--clay-dark)); color: #fff;
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 6px 16px rgba(var(--clay-rgb),0.4);
    transition: opacity 0.2s ease, transform 0.15s ease;
  }
  .sheet-confirm:disabled { opacity: 0.45; box-shadow: none; cursor: not-allowed; }
  .sheet-confirm:not(:disabled):active { transform: scale(0.98); }
  .sheet-cancel {
    width: 100%; margin-top: 8px; padding: 12px; border: none; background: none;
    color: var(--muted); font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .ad-input {
    width: 100%; padding: 11px 12px; margin-bottom: 8px;
    border: 1px solid var(--border); border-radius: 10px;
    background: #fff; color: var(--ink); font-family: inherit; font-size: 16px;
  }
  .ad-sub { margin: -2px 0 14px; color: var(--muted); font-size: 13px; }
  .ad-err { min-height: 20px; margin-bottom: 8px; color: #B8213F; font-size: 13px; }
  .admin-sheet { max-width: 720px; }
  .ad-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .ad-head h3 { margin: 0; }
  .ad-x { border: none; background: var(--border); width: 34px; height: 34px; border-radius: 50%; font-size: 15px; cursor: pointer; }
  .ad-stats { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .ad-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .ad-btn {
    padding: 9px 14px; border-radius: 999px; border: 1.5px solid #1A1A1A;
    background: transparent; color: #1A1A1A; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .ad-btn:hover { background: #1A1A1A; color: #fff; }
  .ad-btn.danger { border-color: #B8213F; color: #B8213F; }
  .ad-btn.danger:hover { background: #B8213F; color: #fff; }
  .ad-note { font-size: 12px; line-height: 1.6; color: var(--muted); background: rgba(185,138,62,0.12); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .ad-code, .ad-hash {
    width: 100%; height: 120px; margin-bottom: 10px; padding: 10px;
    border: 1px solid var(--border); border-radius: 10px; font-family: monospace; font-size: 11px; background: #fff;
  }
  .ad-pw { margin-bottom: 10px; font-size: 13px; }
  .ad-pw summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
  .ad-list { max-height: 48vh; overflow-y: auto; }
  .ad-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .ad-row.is-hidden { opacity: 0.5; }
  .ad-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .ad-num { font-family: "Playfair Display", Georgia, serif; font-weight: 700; color: var(--clay); letter-spacing: 0.1em; }
  .ad-hide { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .ad-two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ad-two label { font-size: 12px; color: var(--muted); }
  .ad-two .ad-input { margin: 3px 0 0; }
  .ad-tabs { display: flex; gap: 6px; margin: 4px 0 12px; border-bottom: 1px solid var(--border); }
  .ad-tab {
    flex: 1; padding: 10px 6px; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--muted);
    border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .ad-tab.active { color: #1A1A1A; border-bottom-color: var(--clay); }
  .ad-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 6px 0 8px; }
  .ad-swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .ad-sw {
    width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
    border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--border), 0 3px 8px rgba(0,0,0,0.18);
  }
  .ad-sw.on { box-shadow: 0 0 0 2.5px #1A1A1A, 0 3px 8px rgba(0,0,0,0.18); }
  .ad-field { display: block; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .ad-field .ad-input { margin: 4px 0 0; }
  .ad-field textarea.ad-input { min-height: 64px; resize: vertical; }
  .ad-field input[type="color"] { width: 100%; height: 44px; padding: 3px; border-radius: 10px; border: 1px solid var(--border); background: #fff; margin-top: 4px; }
  .ad-check { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 8px 0; color: var(--ink); }
  .ad-check input { width: 18px; height: 18px; }
  .ad-hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
  .ad-saved {
    margin-left: auto; margin-right: 10px; font-size: 12px; font-weight: 600; color: #3F7D5C;
    background: rgba(63,125,92,0.12); padding: 4px 10px; border-radius: 999px;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .ad-saved.show { opacity: 1; }
  .ad-filters { display: flex; gap: 6px; margin-bottom: 8px; }
  .ad-filters button {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: #fff; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink);
  }
  .ad-filters button.on { background: #1A1A1A; border-color: #1A1A1A; color: #fff; }
  .ad-list { max-height: 56vh; }
  .ad-row { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: start; }
  .ad-thumb {
    width: 74px; height: 98px; object-fit: cover; border-radius: 10px;
    background: #E9DBC0; box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  .ad-main { min-width: 0; }
  .ad-quick { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .ad-q {
    padding: 5px 10px; border-radius: 999px; border: 1px solid #E8445F; background: #fff; color: #B8213F;
    font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .ad-q:hover { background: #E8445F; color: #fff; }
  .ad-q.clr { border-color: var(--border); color: var(--muted); }
  .ad-empty { text-align: center; padding: 30px 0; color: var(--muted); font-size: 14px; }
  .ad-three { display: grid; grid-template-columns: 1fr 1fr 0.8fr; gap: 6px; }
  .ad-three label { font-size: 12px; color: var(--muted); }
  .ad-three .ad-input { margin: 3px 0 0; padding: 10px 8px; }
  .ad-q.stk { border-color: #1A1A1A; color: #1A1A1A; }
  .ad-q.stk:hover { background: #1A1A1A; color: #fff; }
  .st-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 14px; }
  .st-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 8px; text-align: center; }
  .st-card b { display: block; font-family: "Playfair Display", Georgia, serif; font-size: 24px; color: var(--clay); }
  .st-card span { font-size: 11px; color: var(--muted); }
  .st-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .st-rank { width: 22px; text-align: center; font-weight: 700; color: var(--clay); }
  .st-thumb { width: 42px; height: 56px; object-fit: cover; border-radius: 8px; background: #E9DBC0; }
  .st-info { flex: 1; min-width: 0; }
  .st-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-bar { height: 6px; background: var(--border); border-radius: 999px; margin: 5px 0 3px; overflow: hidden; }
  .st-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--clay), var(--brass)); border-radius: 999px; }
  .st-meta { font-size: 11px; color: var(--muted); }
  .admin-sheet {
    display: flex; flex-direction: column;
    height: 92vh; max-height: 92vh; overflow: hidden;
    padding-bottom: 0;
  }
  .admin-sheet .ad-head { flex: 0 0 auto; padding-bottom: 6px; }
  .admin-sheet #ad-body {
    flex: 1; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch; padding-bottom: 10px;
  }
  .ad-list { max-height: none; overflow: visible; }
  .ad-foot {
    flex: 0 0 auto; padding: 10px 0 calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border); background: var(--card);
  }
  .ad-foot button {
    width: 100%; padding: 13px; border: none; border-radius: 999px;
    background: #1A1A1A; color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .ad-x { width: 40px; height: 40px; font-size: 17px; flex: 0 0 auto; }
  .ad-row.no-thumb { grid-template-columns: 1fr; }
  .ad-side { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .ad-thumbwrap { width: 74px; height: 98px; border-radius: 10px; overflow: hidden; background: #E9DBC0; box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
  .ad-thumbwrap .ad-thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 0; box-shadow: none; display: block; }
  .ad-photo-btn, .ad-dl, .ad-del, .ad-delimg {
    display: block; width: 74px; text-align: center; padding: 6px 2px;
    border: 1px solid var(--border); border-radius: 999px; background: #fff; color: var(--ink);
    font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .ad-dl { border-color: #3F7D5C; color: #3F7D5C; }
  .ad-del, .ad-delimg { border-color: #B8213F; color: #B8213F; }
  .ad-addbtn { width: 100%; margin-bottom: 10px; padding: 12px; background: #1A1A1A; color: #fff; }
  .ad-addbtn:hover { background: var(--clay); border-color: var(--clay); }
  .ad-addform { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .ad-photo-pick {
    display: flex; align-items: center; justify-content: center;
    height: 170px; margin-bottom: 10px; border-radius: 14px; cursor: pointer;
    border: 2px dashed var(--border); background: #FBF4E6 center / cover no-repeat;
    color: var(--muted); font-size: 14px; font-weight: 600;
  }
  .ad-photo-pick.has { border-style: solid; color: #fff; }
  .ad-photo-pick.has span { background: rgba(26,26,26,0.7); padding: 6px 14px; border-radius: 999px; }
  .ad-addrow { margin-top: 4px; }
  .ad-tabs { overflow-x: auto; scrollbar-width: none; }
  .ad-tabs::-webkit-scrollbar { display: none; }
  .ad-tab { flex: 1 0 auto; padding: 10px 12px; white-space: nowrap; }
  .sheet-confirm { padding: 16px; font-size: 16px; }
  @media (max-width: 640px) {
    .ad-row { grid-template-columns: 58px 1fr; gap: 10px; }
    .ad-thumbwrap { width: 58px; height: 78px; }
    .ad-photo-btn, .ad-dl, .ad-del, .ad-delimg { width: 58px; font-size: 10px; }
  }

  /* ===== Admin UI v2 ===== */
  body { background: linear-gradient(180deg, #FBF6EF, #F3EAE0) fixed; }
  #admin-app > .ad-top { position: sticky; top: 0; z-index: 25; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; background: linear-gradient(135deg, #2A1F18, #4A3228); color: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.18); margin: 0; }
  .ad-logo { width: 32px; height: 32px; border-radius: 50%; background: var(--clay); color: #fff; display: grid; place-items: center; font: 700 17px Georgia, serif; flex: none; }
  #admin-app > .ad-top h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; }
  #admin-app > .ad-top .ad-saved { margin: 0; font-size: 11px; padding: 3px 8px; border-radius: 999px; }
  .ad-site, .ad-out { font: 600 12px inherit; color: #fff; text-decoration: none; padding: 7px 10px; border-radius: 10px; background: rgba(255,255,255,.14); border: none; cursor: pointer; white-space: nowrap; }
  .ad-out { background: rgba(184,33,63,.55); }
  .ad-wrap { padding: 14px 14px 110px; }
  .ad-tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; display: flex; gap: 2px; overflow: visible; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: rgba(255,252,246,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border); box-shadow: 0 -6px 24px rgba(0,0,0,.06); }
  .ad-tab { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; font-size: 10.5px; font-weight: 600; color: var(--muted); border: none; border-bottom: none; background: none; border-radius: 12px; white-space: nowrap; }
  .ad-tab .ic { font-size: 19px; line-height: 1.2; }
  .ad-tab.active { color: var(--clay-dark); background: rgba(var(--clay-rgb), .12); border-bottom: none; }
  .bd { position: absolute; top: 2px; right: 10%; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: #B8213F; color: #fff; font: 700 10px/17px inherit; text-align: center; }
  .ad-panel { animation: adIn .18s ease; } @keyframes adIn { from { opacity: 0; transform: translateY(6px); } }
  .ad-row { background: var(--card); border: 1px solid var(--border) !important; border-radius: 16px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(60,30,20,.05); }
  .ad-input:focus { outline: none; border-color: var(--clay); box-shadow: 0 0 0 3px rgba(var(--clay-rgb), .15); }
  .ad-row .ad-top { position: static; background: transparent; color: var(--ink); padding: 0 0 4px; box-shadow: none; }
  .ad-row .ad-num { color: var(--clay-dark); font-weight: 700; }
  /* orders */
  .od-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .od-stat { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 11px 12px; box-shadow: 0 1px 3px rgba(60,30,20,.05); }
  .od-stat b { display: block; font-size: 17px; } .od-stat span { font-size: 11.5px; color: var(--muted); }
  .od-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; scrollbar-width: none; }
  .od-chips::-webkit-scrollbar { display: none; }
  .od-sm { padding: 7px 12px; border: 1.5px solid var(--border); border-radius: 999px; background: var(--card); color: var(--ink); font: 500 13px inherit; cursor: pointer; white-space: nowrap; }
  .od-sm.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .od-card { background: var(--card); border: 1px solid var(--border); border-left: 5px solid #C98A1B; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(60,30,20,.06); }
  .od-card.contacted { border-left-color: #2E6DB4; } .od-card.shipping { border-left-color: #7A4EC2; } .od-card.done { border-left-color: #3F7D5C; } .od-card.cancel { border-left-color: #B8213F; opacity: .65; }
  .od-top { display: flex; justify-content: space-between; gap: 8px; } .od-name { font-weight: 700; font-size: 15.5px; } .od-time { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .od-meta { margin: 6px 0 10px; font-size: 14px; line-height: 1.75; word-break: break-word; } .od-meta a { color: var(--clay-dark); font-weight: 700; text-decoration: none; }
  .od-price { font-weight: 700; color: var(--clay-dark); }
  .od-box { margin: 8px 0 10px; padding: 10px; border: 1px dashed var(--border); border-radius: 12px; background: rgba(255,255,255,.5); }
  .od-row { display: flex; gap: 6px; } .od-row input { margin: 0; min-width: 0; font-size: 14px; padding: 9px 10px; width: 100%; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; }
  .od-stat2 { font-size: 13px; font-weight: 700; margin: 8px 0 0; }
  .od-acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .od-empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  #rcv { position: fixed; inset: 0; z-index: 99; background: rgba(0,0,0,.9); align-items: center; justify-content: center; flex-direction: column; padding: 16px; gap: 12px; }
  #rcv-x { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 12px; padding: 8px 14px; border: none; border-radius: 999px; background: #fff; font: 600 13px inherit; }
  #rcv-msg, #rcv-open { color: #fff; font-size: 14px; } #rcv-img { display: none; max-width: 100%; max-height: 78vh; border-radius: 12px; background: #fff; } #rcv-open { display: none; }

  /* ===== Pro UI v2 · admin polish ===== */
  :focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
  #admin-app > .ad-top { background: #1F1813; box-shadow: none; border-bottom: 1px solid rgba(255,255,255,.08); }
  .ad-row, .od-card, .od-stat, .od-box { box-shadow: none !important; }
  .ad-row, .od-card { border-radius: 14px; }
  .od-card { padding: 14px 14px 12px; }
  .od-sm { min-height: 36px; border-radius: 10px; }
  .od-row input, .ad-input { min-height: 40px; border-radius: 10px; }
  .od-stat b { font-size: 18px; }
  .ad-tabs { box-shadow: none; border-top: 1px solid var(--border); background: rgba(255,255,255,.96); }
  .ad-tab.active { background: rgba(var(--clay-rgb), .1); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <div class="ad-login" id="admin-login">
    <div class="ad-card">
      <h1>Admin</h1>
      <p class="ad-sub">សម្រាប់ម្ចាស់ហាងប៉ុណ្ណោះ</p>
      <input id="admin-email" class="ad-input" type="email" placeholder="អ៊ីមែល" autocomplete="username" style="margin-bottom:10px" />
      <input id="admin-pass" class="ad-input" type="password" placeholder="ពាក្យសម្ងាត់" autocomplete="current-password" />
      <div class="ad-err" id="admin-err"></div>
      <button class="sheet-confirm" id="admin-go" type="button">ចូល</button>
    </div>
  </div>

  <div id="admin-app" style="display:none">
    <div class="ad-top"><span class="ad-logo">T</span><h1>Thea Fashion</h1><span class="ad-saved" id="ad-saved">✓</span><a class="ad-site" href="index.html" aria-label="មើលគេហទំព័រ">🌐</a><button class="ad-out" id="ad-logout" type="button">ចេញ</button></div>

function processImage(file, maxSide = 900) {
  const draw = (img) => {
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if (!w || !h) throw new Error("size");
    const k = Math.min(1, maxSide / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const out = c.toDataURL("image/jpeg", 0.82);
    if (!out || out.length < 100) throw new Error("canvas");
    return out;
  };
  const load = (src) => new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { try { res(draw(img)); } catch (e) { rej(e); } };
    img.onerror = () => rej(new Error("img"));
    img.src = src;
  });
  // ព្យាយាម blob URL មុន បើមិនបាន ប្រើ FileReader
  const url = URL.createObjectURL(file);
  return load(url).finally(() => URL.revokeObjectURL(url)).catch(() => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => load(r.result).then(res, rej);
    r.onerror = () => rej(new Error("read"));
    r.readAsDataURL(file);
  }));
}

    if (!r.ok) throw new Error(r.status === 401 ? "key" : "http " + r.status);

  }

}

          await api(`coupons?code=eq.${encodeURIComponent(code)}`, { method: "DELETE" }); cpLoad();

    };
  };
  // ----- ចំណូលលក់ -----
  let rng = "today";
  function revBox() {
    const keyAgo = (k) => dayKey(new Date(Date.now() - k * 864e5)), today = keyAgo(0), live = orders.filter((o) => o.status !== "cancel");
    const inR = (o) => { const k = dayKey(o.created_at); return rng === "today" ? k === today : rng === "7" ? k >= keyAgo(6) : rng === "month" ? k.slice(0, 7) === today.slice(0, 7) : true; };
    const sel = live.filter(inR), rev = sel.reduce((s, o) => s + (o.price || 0), 0), days = [6, 5, 4, 3, 2, 1, 0].map((k) => { const d = keyAgo(k); return [d.slice(5), live.filter((o) => dayKey(o.created_at) === d).reduce((s, o) => s + (o.price || 0), 0)]; });
    const mx = Math.max(1, ...days.map((d) => d[1])), top = {};

    const tp = Object.entries(top).sort((x, y) => y[1] - x[1]).slice(0, 3), R = [["today", "ថ្ងៃនេះ"], ["7", "៧ ថ្ងៃ"], ["month", "ខែនេះ"], ["all", "ទាំងអស់"]];

      <div style="font-size:12px;color:var(--muted)">ចំណូល (មិនរាប់ការបោះបង់)</div><div style="font-size:24px;font-weight:700;color:var(--clay-dark)">${money(rev)}</div>
      <div style="font-size:13px;color:var(--muted)">${sel.length} ការកម្មង់ · មធ្យម ${money(sel.length ? Math.round(rev / sel.length) : 0)}</div>
      <div style="display:flex;gap:4px;align-items:flex-end;height:54px;margin:10px 0 2px">${days.map(([d, v]) => `<div style="flex:1;text-align:center;font-size:9px;color:var(--muted)"><div style="height:${Math.max(3, Math.round((v / mx) * 40))}px;background:var(--clay);border-radius:4px 4px 0 0;opacity:${v ? 1 : .25}"></div>${d}</div>`).join("")}</div>
      ${tp.length ? `<div style="font-size:12px;margin-top:8px;color:var(--muted)">លក់ដាច់៖ ${tp.map(([n, q]) => e2(n) + " ×" + q).join(" · ")}</div>` : ""}</div>`;
  }
  window.odLoad = async function () {
    if (!ready) return;
    const ae = document.activeElement;

  };
  window.odInit = function () {

    root.innerHTML = `<div class="od-stats" id="od-stats"></div><div id="od-rev"></div><div class="od-chips" id="od-chips"></div><div id="od-list"><div class="od-empty">កំពុងទាញ...</div></div>`;
    ready = true; odLoad(); clearInterval(timer); timer = setInterval(() => { if (!document.hidden) odLoad(); }, 30000);
    $("od-rev").onclick = (e) => { const b = e.target.closest("[data-rg]"); if (b) { rng = b.dataset.rg; draw(); } };
    $("od-chips").onclick = (e) => { const b = e.target.closest("[data-f]"); if (b) { flt = b.dataset.f; draw(); } };
    $("rcv-x").onclick = () => { $("rcv").style.display = "none"; $("rcv-img").removeAttribute("src"); };
    $("od-list").onclick = async (e) => {
      const b = e.target.closest("button"), card = e.target.closest(".od-card");
      if (!b || !card) return;
      const id = card.dataset.id, o = orders.find((x) => String(x.id) === id), g = (s) => card.querySelector(s).value.trim();
      try {
        if (b.dataset.rc) {
          const v = $("rcv"), im = $("rcv-img"), msg = $("rcv-msg"), op = $("rcv-open");
          v.style.display = "flex"; im.style.display = "none"; op.style.display = "none"; msg.textContent = "កំពុងផ្ទុករូប...";
          const t = await sbToken();
          const r = await fetch(`${SB_URL}/storage/v1/object/sign/receipts/${b.dataset.rc}`, { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: JSON.stringify({ expiresIn: 300 }) });
          const j = await r.json().catch(() => ({}));
          if (!r.ok || !j.signedURL) { msg.textContent = `មើលមិនបាន៖ ${r.status} ${j.message || j.error || ""}`; return; }
          const u = `${SB_URL}/storage/v1${j.signedURL}`;
          im.onload = () => { msg.textContent = ""; im.style.display = "block"; op.href = u; op.style.display = "block"; };
          im.onerror = () => { msg.textContent = "បើករូបមិនបាន"; };

          const msg = `សួស្តី${o.payer_name ? " " + o.payer_name : ""}! ការទិញ ${o.product}${o.size ? " ទំហំ " + o.size : ""} តម្លៃ ${money(o.price)}។ យើងទទួលបាន ${money(o.paid_amount)} ប៉ុណ្ណោះ បង់មិនទាន់គ្រប់ ខ្វះ ${money(short)}។ សូមបង់បន្ថែម ហើយផ្ញើបង្កាន់ដៃមកវិញ។ អរគុណ!`;

        }
      } catch (err) { alert("មិនបាន៖ " + err.message); }
    };
  };

        <select class="ad-input" data-s="saleHours" data-num="1">
          ${[1, 2, 3, 4, 6, 8, 12, 24].map((h) => `<option value="${h}"${settings.saleHours === h ? " selected" : ""}>${h} ម៉ោង</option>`).join("")}
        </select></label>
      <div class="ad-hint">ម៉ោងគិតតាមម៉ោងកម្ពុជា ចាប់ពី 00:00</div>
      <label class="ad-field">ត្រូវចូលគណនីមុនទិញ?
        <select class="ad-input" data-s="requireLogin" data-num="1">
          <option value="0"${Number(settings.requireLogin) === 1 ? "" : " selected"}>ទេ (ភ្ញៀវទិញបានដោយមិនចាំបាច់ចូល)</option>
          <option value="1"${Number(settings.requireLogin) === 1 ? " selected" : ""}>បាទ/ចាស (ត្រូវចូលគណនីមុន)</option>
        </select></label>
      <label class="ad-field">គណនីទទួលប្រាក់ (ឈ្មោះ + លេខ ACLEDA)<input class="ad-input" data-s="payAccount" value="${esc(settings.payAccount)}" placeholder="ឧ. ACLEDA 0000 0000 0000 · SOK DARA" /></label>
      <div class="ad-hint">ដាក់រូប QR ឈ្មោះ KHQR.jpg ទៅជាមួយ index.html ដើម្បីបង្ហាញលើទំព័របង់ប្រាក់។</div>
      <label class="ad-field">URL Worker ស្ថិតិ (ទទេ = រាប់លើឧបករណ៍នេះប៉ុណ្ណោះ)<input class="ad-input" data-s="statsUrl" value="${esc(settings.statsUrl)}" placeholder="https://stats.xxx.workers.dev" /></label>
    </div>`;
  const list = document.getElementById("ad-list");
  const stats = () => {
    document.getElementById("ad-stats").textContent =
      `${PRODUCTS.length} ទំនិញ · លាក់ ${adminData.hidden.length} · អស់ស្តុក ${Object.values(adminData.stock).filter((v) => v !== "" && Number(v) === 0).length} · បញ្ចុះដោយដៃ ${Object.keys(adminData.sale).length}`;
  };
  stats();

  list.onchange = (e) => {
    const el = e.target, row = el.closest(".ad-row");
    if (!row) return;
    const n = Number(row.dataset.n), f = el.dataset.f, p = PRODUCTS[n - 1];
    if (el.dataset.img) {                         // ប្តូររូបទំនិញ
      const file = el.files && el.files[0];
      if (!file) return;
      processImage(file).then((d) => sbOn() ? sbUpload("p" + n + ".jpg", d) : d).then((data) => {
        adminImages[n] = data;
        if (!saveImages()) { delete adminImages[n]; return; }
        flashSaved(); refreshSite();
        const keep = list.scrollTop;
        list.innerHTML = adminRows(document.getElementById("ad-search").value);
        list.scrollTop = keep;
      }).catch((err) => alert("បើករូបមិនបាន (" + (err && err.message) + ")។ សូមសាកល្បងរូប JPG/PNG"));
      return;
    }
    if (f === "name" || f === "place") p[f] = el.value.trim();
    else if (f === "price") { p.price = Math.max(0, Math.round(Number(el.value) || 0)); }
    else if (f === "stock") {
      if (el.value === "") delete adminData.stock[n];
      else adminData.stock[n] = Math.max(0, Math.round(Number(el.value) || 0));
      window.__sd.add(String(n));
    }
    else if (f === "sale") {
      const v = Math.round(Number(el.value) || 0);
      if (v > 0) adminData.sale[n] = v; else delete adminData.sale[n];
    } else if (f === "hide") {
      const set = new Set(adminData.hidden);
      el.checked ? set.add(n) : set.delete(n);
      adminData.hidden = [...set].sort((a, b) => a - b);
      row.classList.toggle("is-hidden", el.checked);
    }
    saveAdmin(); refreshSite(); stats();
  };
  adFilter = "all";
  const searchEl = document.getElementById("ad-search");
  searchEl.addEventListener("input", (e) => { list.innerHTML = adminRows(e.target.value); });
  document.querySelectorAll("#ad-filters button").forEach((b) => b.addEventListener("click", () => {
    adFilter = b.dataset.flt;
    document.querySelectorAll("#ad-filters button").forEach((x) => x.classList.toggle("on", x === b));
    list.innerHTML = adminRows(searchEl.value);
    list.scrollTop = 0;
  }));
  // បញ្ចុះតម្លៃលឿន (-10% / -20% / -30% / លុប)
  list.addEventListener("click", (e) => {
    const di = e.target.closest(".ad-delimg");
    if (di) {
      const n = Number(di.dataset.delimg);
      // ចុចពីរដង (មិនប្រើ confirm ព្រោះកម្មវិធីខ្លះរារាំង)
      if (di.dataset.sure !== "1") {
        di.dataset.sure = "1"; di.textContent = "ចុចម្តងទៀត";
        di.style.background = "#B8213F"; di.style.color = "#fff";
        setTimeout(() => { if (di.isConnected) { di.dataset.sure = ""; di.textContent = "🗑 លុបរូប"; di.style.background = ""; di.style.color = ""; } }, 3000);
        return;
      }
      delete adminImages[n];
      saveImages(); flashSaved();
      const keep = list.scrollTop;
      list.innerHTML = adminRows(document.getElementById("ad-search").value);
      list.scrollTop = keep;
      return;
    }
    const del = e.target.closest(".ad-del");
    if (del) {
      const n = Number(del.dataset.del);
      if (del.dataset.sure !== "1") {            // ចុចពីរដង
        del.dataset.sure = "1"; del.textContent = "ចុចម្តងទៀត";
        del.style.background = "#B8213F"; del.style.color = "#fff";
        setTimeout(() => { if (del.isConnected) { del.dataset.sure = ""; del.textContent = "🗑 លុបប្រអប់"; del.style.background = ""; del.style.color = ""; } }, 3000);
        return;
      }
      delete adminImages[n]; delete adminData.stock[n]; delete adminData.sale[n]; window.__sd.add(String(n));
      adminData.hidden = adminData.hidden.filter((x) => x !== n);
      if (n === PRODUCTS.length && n > ORIG_PRODUCTS.length) PRODUCTS.pop();      // ទំនិញថ្មីចុងក្រោយ → លុបពិត
      else adminData.deleted = [...new Set([...(adminData.deleted || []), n])];  // ផ្សេងទៀត → លាក់ជាអចិន្ត្រៃយ៍
      saveImages(); saveAdmin(); refreshSite(); stats();
      const keep = list.scrollTop;
      list.innerHTML = adminRows(document.getElementById("ad-search").value);
      list.scrollTop = keep;
      return;
    }
    const btn = e.target.closest(".ad-q");
    if (!btn) return;
    const row = btn.closest(".ad-row"), n = Number(row.dataset.n), price = PRODUCTS[n - 1].price;
    if (btn.dataset.p === "soldout") {
      adminData.stock[n] = 0; window.__sd.add(String(n));
      row.querySelector('[data-f="stock"]').value = 0;
      saveAdmin(); refreshSite(); stats();
      return;
    }
    const pct = Number(btn.dataset.p);
    const input = row.querySelector('[data-f="sale"]');
    if (!pct) { delete adminData.sale[n]; input.value = ""; }
    else {
      let np = Math.round((price * (100 - pct)) / 100 / 1000) * 1000;
      if (np >= price) np = price - 1000;
      if (np <= 0) return;
      adminData.sale[n] = np; input.value = np;
    }
    saveAdmin(); refreshSite(); stats();
  });

  // tabs
  body.querySelectorAll(".ad-tab").forEach((t) => t.addEventListener("click", () => {
    body.querySelectorAll(".ad-tab").forEach((x) => x.classList.toggle("active", x === t));
    body.querySelectorAll(".ad-panel").forEach((pn) => (pn.style.display = pn.dataset.tab === t.dataset.tab ? "" : "none"));
    if (t.dataset.tab === "stats") renderStats();
    if (t.dataset.tab === "orders") odLoad();
    if (t.dataset.tab === "promo") window.cpLoad && cpLoad();
    if (t.dataset.tab === "products" && sbOn() && window.__sd.size === 0) {
      sbPull().then((rd) => {
        if (!rd || !rd.stock || JSON.stringify(rd.stock) === JSON.stringify(adminData.stock)) return;
        adminData.stock = rd.stock; try { localStorage.setItem("adminData", JSON.stringify(adminData)); } catch (e) {}
        const l = document.getElementById("ad-list"), s = document.getElementById("ad-search"); if (l) l.innerHTML = adminRows(s ? s.value : "");
      }).catch(() => {});
    }
    const st = document.getElementById("ad-stats"); if (st) st.style.display = t.dataset.tab === "products" ? "" : "none";
  }));

  // ផុសទំនិញថ្មី
  let newPhoto = "";
  const addForm = document.getElementById("ad-addform");
  const resetAddForm = () => {
    newPhoto = "";
    ["ad-new-name", "ad-new-place", "ad-new-price"].forEach((id) => (document.getElementById(id).value = ""));
    document.getElementById("ad-new-file").value = "";
    const pick = document.getElementById("ad-photo-pick");
    pick.style.backgroundImage = ""; pick.classList.remove("has");
    document.getElementById("ad-photo-label").textContent = "📷 ជ្រើសរើសរូបទំនិញ";
  };
  document.getElementById("ad-add-open").addEventListener("click", () => {
    addForm.style.display = addForm.style.display === "none" ? "" : "none";
  });
  document.getElementById("ad-add-cancel").addEventListener("click", () => { resetAddForm(); addForm.style.display = "none"; });
  document.getElementById("ad-new-file").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    processImage(f).then((data) => {
      newPhoto = data;
      const pick = document.getElementById("ad-photo-pick");
      pick.style.backgroundImage = `url("${data}")`; pick.classList.add("has");
      document.getElementById("ad-photo-label").textContent = "📷 ប្តូររូប";
    }).catch((err) => alert("បើករូបមិនបាន (" + (err && err.message) + ")។ សូមសាកល្បងរូប JPG/PNG"));
  });
  document.getElementById("ad-add-save").addEventListener("click", async () => {
    const name = document.getElementById("ad-new-name").value.trim();
    const place = document.getElementById("ad-new-place").value.trim() || "Free Size";
    const price = Math.round(Number(document.getElementById("ad-new-price").value) || 0);
    if (!name || price <= 0) { alert("សូមបំពេញឈ្មោះ និងតម្លៃ"); return; }
    PRODUCTS.push({ name, place, price });
    const n = PRODUCTS.length;
    if (newPhoto) {
      try { adminImages[n] = sbOn() ? await sbUpload("p" + n + ".jpg", newPhoto) : newPhoto; }
      catch (e) { alert("upload រូបមិនបាន (" + e.message + ")"); }
      if (adminImages[n] && !saveImages()) delete adminImages[n];
    }
    saveAdmin(); refreshSite(); stats();
    resetAddForm(); addForm.style.display = "none";
    searchEl.value = "";
    adFilter = "all";
    document.querySelectorAll("#ad-filters button").forEach((x) => x.classList.toggle("on", x.dataset.flt === "all"));
    list.innerHTML = adminRows("");
    list.lastElementChild && list.lastElementChild.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  // settings (live)
  const commitSetting = (k) => {
    rebuildSettings(); saveAdmin(); applySettings();
    if (k === "saleCount" || k === "saleHours") { currentPeriod = periodKey(); refreshSite(); tickTimer(); }
  };
  body.addEventListener("input", (e) => {
    const el = e.target, k = el.dataset && el.dataset.s;
    if (!k) return;
    let v;
    if (el.type === "checkbox") v = el.checked;
    else if (el.dataset.num) { v = Math.round(Number(el.value)); if (!(v >= 1)) return; if (k === "saleCount") v = Math.min(v, PRODUCTS.length); }
    else v = el.value;
    adminData.settings[k] = v;
    if (k === "accent") body.querySelectorAll(".ad-sw").forEach((b) => b.classList.toggle("on", b.dataset.c.toLowerCase() === String(v).toLowerCase()));
    commitSetting(k);
  });
  body.querySelectorAll(".ad-sw").forEach((b) => b.addEventListener("click", () => {
    adminData.settings.accent = b.dataset.c;
    document.getElementById("ad-color").value = b.dataset.c;
    body.querySelectorAll(".ad-sw").forEach((x) => x.classList.toggle("on", x === b));
    commitSetting("accent");
  }));

  document.getElementById("ad-logout").addEventListener("click", () => {
    try { localStorage.removeItem("adminOn"); localStorage.removeItem("sbSess"); } catch (e) {}
    location.reload();
  });
  // ផ្ទាំងផ្សព្វផ្សាយ
  const promoPanel = body.querySelector('.ad-panel[data-tab="promo"]');
  const editBanner = (i, f, v) => {
    const arr = (adminData.settings.banners || settings.banners).map((b) => ({ ...b }));
    if (!arr[i]) return;
    if (f === "link") { if (/^https?:/i.test(v)) arr[i].target = v; else if (/^https?:/i.test(arr[i].target)) arr[i].target = "all"; }
    else arr[i][f] = v;
    adminData.settings.banners = arr;
    rebuildSettings(); saveAdmin(); renderPromo();
  };
  promoPanel.addEventListener("input", (e) => {
    const el = e.target, card = el.closest(".bn-card");
    if (card && el.dataset.bf && el.dataset.bf !== "target") editBanner(Number(card.dataset.bi), el.dataset.bf, el.value);
  });
  promoPanel.addEventListener("change", (e) => {
    const el = e.target, card = el.closest(".bn-card");
    if (!card) return;
    if (el.dataset.bf === "target") { editBanner(Number(card.dataset.bi), "target", el.value); const lk = card.querySelector('[data-bf="link"]'); if (lk) lk.value = ""; }
    if (el.dataset.bimg) {
      const f = el.files && el.files[0];
      if (!f) return;
      processImage(f, 1600).then((d) => sbOn() ? sbUpload("b" + el.dataset.bimg + ".jpg", d) : d).then((data) => {
        adminImages["b" + el.dataset.bimg] = data;
        if (!saveImages()) { delete adminImages["b" + el.dataset.bimg]; return; }
        flashSaved(); renderPromo();
      }).catch((err) => alert("បើករូបមិនបាន (" + (err && err.message) + ")។ សូមសាកល្បងរូប JPG/PNG"));
    }
  });
  adminSheet.classList.add("open");
}


// ---- ចាប់ផ្តើម ----
(async () => {
  if (adminOn && sbOn() && !sbSess) adminOn = false;     // ត្រូវចូលតាម Supabase
  if (adminOn) { await syncFromRemote(); loadAdminData(); openAdminPanel(); } else openAdminLogin();
})();
// ការពារ zoom លើទូរស័ព្ទ
["gesturestart", "gesturechange", "gestureend"].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault()));
</script>
</body>
</html>
